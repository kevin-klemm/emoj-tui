[package]
name = "emoj-tui"
version = "0.1.0"
edition = "2021"
description = "A tiny, fast terminal emoji picker — type to filter, Enter to copy."
license = "MIT"

[[bin]]
name = "emoji"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
emojis = "0.9"
arboard = "3"
nucleo-matcher = "0.3"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
